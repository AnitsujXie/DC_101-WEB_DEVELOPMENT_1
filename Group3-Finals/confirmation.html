<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .confirmation-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .confirmation-message h2 {
            font-size: 24px;
            color: #4CAF50;
        }

        .confirmation-message p {
            font-size: 18px;
            color: #333;
        }

        .btn-go-to-car-rent {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        .btn-go-to-car-rent:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="confirmation-message">
        <h2>Your Order is Successful!</h2>
        <p>Please wait for confirmation in your email.</p>
        <a href="Car rent.html">
            <button class="btn-go-to-car-rent">Go to Car Rental</button>
        </a>
    </div>
</body>
</html>
